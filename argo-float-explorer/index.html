<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Argo Float Explorer</title>
    <!--
      No external stylesheet or font request: IBM Plex is bundled from
      @fontsource (imported by src/index.css), so the app runs fully offline
      and never blocks first paint on a third-party CDN.
    -->
    <style>
      /* Inline so it applies even when the JS/CSS bundle never loads. */
      html, body { height: 100%; margin: 0; background: #050d16; }
      .boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 10px; padding: 24px;
        text-align: center; color: #dfe9ef; font: 500 14px/1.5 system-ui, sans-serif;
      }
      .boot__detail {
        font: 400 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #7d95a3; max-width: 46ch;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!--
        Boot fallback. React replaces this markup on first render, so it is only
        ever seen when the bundle fails to load or throws before mounting -
        the cases that used to leave the page silently blank.
      -->
      <div class="boot" id="boot-fallback">
        <p>Loading Argo Float Explorer…</p>
        <p class="boot__detail">
          If this message stays on screen the app bundle could not start. Check the
          browser console, and confirm the page is served from the same base path the
          bundle was built with.
        </p>
      </div>
    </div>
    <script>
      // Report a failed module load or a pre-mount exception in the page instead of
      // leaving the user looking at an empty screen.
      (function () {
        var root = document.getElementById('root');

        function fail(message) {
          if (!root || root.dataset.mounted === 'true') return;
          root.innerHTML =
            '<div class="boot"><p>Argo Float Explorer failed to start</p>' +
            '<p class="boot__detail">' +
            String(message).replace(/[&<>]/g, function (c) {
              return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
            }) +
            '</p></div>';
        }

        window.addEventListener(
          'error',
          function (event) {
            var target = event.target;
            if (target && target.tagName === 'SCRIPT') {
              fail('A script failed to load: ' + (target.src || 'unknown source'));
            } else if (event.error) {
              fail(event.error.message || String(event.error));
            }
          },
          true,
        );

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          fail((reason && reason.message) || String(reason));
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
